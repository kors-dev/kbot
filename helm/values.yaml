# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
image:
  repository: kors-dev/kbot
  tag: "v2.2.5-d53fcda"
  arch: amd64
  registry: ghcr.io
  os: "linux"
secret:
  name: "kbot"
  tokenKey: "token"
  tokenName: "TELE_TOKEN"
serviceAccount:
  create: false
  automount: true
  name: "default"
service:
  type: ClusterIP
  port: 80
  targetPort: 80
  annotations: {}
securityContext:
  privileged: true
