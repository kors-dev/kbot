# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: kors-dev
  tag: "v1.0.6-8c6625a"
  arch: amd64

secret:
  name: "kbot"
  tokenKey: "token"
  tokenName: "TELE_TOKEN"

serviceAccount:
   create: false      
   automount: true   
   name: "default"  

service:
  type: ClusterIP
  port: 80       
  targetPort: 80
  annotations: {}

securityContext:
  privileged: true  