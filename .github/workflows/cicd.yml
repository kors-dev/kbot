name: KBOT-CICD

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: write    # щоб комітити зміни у helm/values.yaml
  packages: write    # щоб пушити образ у GHCR

env:
  TARGETARCH: amd64
  TARGETOS: linux
  CGO_ENABLED: 0
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository_owner }}/kbot

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      # - name: Run tests
      #   run: make test

      - name: Build (local check)
        run: make build TARGETARCH=${{ env.TARGETARCH }} TARGETOS=${{ env.TARGETOS }}

  cd:
    name: CD
    needs: ci
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set version (from Helm appVersion + short SHA)
        id: ver
        shell: bash
        run: |
          APP_VERSION=$(grep -E '^appVersion:' helm/Chart.yaml | awk '{print $2}' | tr -d '"' || true)
          if [ -z "$APP_VERSION" ]; then APP_VERSION=v1.0.0; fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="${APP_VERSION}-${SHORT_SHA}"
          FULL_TAG="${IMAGE_TAG}-${{ env.TARGETOS }}-${{ env.TARGETARCH }}"
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG"     >> $GITHUB_ENV
          echo "FULL_TAG=$FULL_TAG"       >> $GITHUB_ENV
          echo "Using tag: $FULL_TAG"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Check GHCR login
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build \
            --platform ${{ env.TARGETOS }}/${{ env.TARGETARCH }} \
            -t ghcr.io/${{ env.IMAGE_REPO }}:${{ env.FULL_TAG }} \
            --build-arg APP_VERSION=${{ env.APP_VERSION }} .
          docker push ghcr.io/${{ env.IMAGE_REPO }}:${{ env.FULL_TAG }}

      - name: Update Helm chart values
        uses: mikefarah/yq@v4.44.3
        with:
          cmd: |
            yq -i '
              .image.registry = strenv(REGISTRY) |
              .image.repository = strenv(IMAGE_REPO) |
              .image.tag = strenv(IMAGE_TAG) |
              .image.os = strenv(TARGETOS) |
              .image.arch = strenv(TARGETARCH)
            ' helm/values.yaml

      - name: Commit Helm chart changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add helm/values.yaml
          git commit -m "ci: bump image to ${{ env.FULL_TAG }}"
          git push
