name: cicd

on:
  push:
    branches: [ develop ]
    tags:     [ 'v*' ]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kbot

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64 ]   # за потреби додай 'arm64'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq & helm
        run: |
          curl -sL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          curl -sL https://get.helm.sh/helm-v3.15.3-linux-amd64.tar.gz | tar zx
          sudo mv linux-amd64/helm /usr/local/bin/helm

      # === Обчислюємо версії/теги в єдиному форматі ===
      - name: Compute tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          BASE_VER="$(yq -r '.version' helm/Chart.yaml)"  # semver з Chart.yaml (формат файлу не змінюємо)

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # push по тегу vX.Y.Z
            GIT_TAG="${GITHUB_REF_NAME}"            # напр. v2.2.2
            BASE_VER="${GIT_TAG#v}"                 # 2.2.2
          fi

          FULL_TAG="v${BASE_VER}-${SHORT_SHA}-linux-${{ matrix.arch }}"
          echo "BASE_VER=$BASE_VER"     >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$SHORT_SHA"   >> $GITHUB_OUTPUT
          echo "FULL_TAG=$FULL_TAG"     >> $GITHUB_OUTPUT

      # === Будуємо та публікуємо образ у форматі vX.Y.Z-<sha>-linux-<arch> ===
      - name: Build & Push image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.FULL_TAG }}

      # === Оновлюємо тільки значення у values.yaml (схему/формат не чіпаємо) ===
      # chart сам збирає імідж як: {{ registry }}/{{ repository }}:{{ tag }}-{{ os }}-{{ arch }}
      - name: Bump helm/values.yaml (no schema changes)
        run: |
          yq -i '.image.registry   = "ghcr.io"'                                         helm/values.yaml
          yq -i '.image.repository = "${{ env.IMAGE_NAME }}"'                           helm/values.yaml
          yq -i '.image.tag        = "v${{ steps.meta.outputs.BASE_VER }}-${{ steps.meta.outputs.SHORT_SHA }}"' helm/values.yaml
          yq -i '.image.os         = "linux"'                                          helm/values.yaml
          yq -i '.image.arch       = "${{ matrix.arch }}"'                              helm/values.yaml

      - name: Commit values.yaml bump (develop only)
        if: github.ref == 'refs/heads/develop'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: bump image to ${{ steps.meta.outputs.FULL_TAG }}"
          branch: develop

      # === Реліз: пакуємо та пушимо Helm-чарт в OCI (формат Chart.yaml не змінюємо) ===
      - name: Package & Push Helm chart (release only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BASE_VER: ${{ steps.meta.outputs.BASE_VER }}
          APP_VER:  ${{ steps.meta.outputs.FULL_TAG }}
        run: |
          # пакуємо чарт з потрібними версіями через флаги (файли не редагуємо)
          helm package helm --version "${BASE_VER}" --app-version "${APP_VER}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          helm push "helm-${BASE_VER}.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
